name: iOS Build Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build-check.yml'

jobs:
  build:
    name: Compile Box (unsigned)
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Show build tools
        run: xcodebuild -version

      - name: Compile for iOS device without signing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Box.xcodeproj \
            -scheme Box \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: box-build-log
          path: ios/build.log
          retention-days: 5
