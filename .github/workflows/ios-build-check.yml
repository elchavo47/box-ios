name: iOS Build Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build-check.yml'

jobs:
  build:
    name: Compile Box (unsigned)
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Show build tools
        run: xcodebuild -version

      - name: Compile for iOS device without signing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Box.xcodeproj \
            -scheme Box \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            > build.log 2>&1 || true

          # Box kaynaklarındaki hata ve uyarıları GitHub annotation olarak göster
          { grep -E "/ios/Box/.*: (error|warning): " build.log || true; } | sort -u | while IFS= read -r line; do
            file="$(echo "$line" | sed -E 's#^.*/ios/(Box/[^:]+):([0-9]+):([0-9]+): (error|warning): (.*)$#\1#')"
            lineno="$(echo "$line" | sed -E 's#^.*/ios/(Box/[^:]+):([0-9]+):([0-9]+): (error|warning): (.*)$#\2#')"
            kind="$(echo "$line" | sed -E 's#^.*/ios/(Box/[^:]+):([0-9]+):([0-9]+): (error|warning): (.*)$#\4#')"
            msg="$(echo "$line" | sed -E 's#^.*/ios/(Box/[^:]+):([0-9]+):([0-9]+): (error|warning): (.*)$#\5#')"
            echo "::${kind} file=ios/${file},line=${lineno}::${msg}"
          done

          grep -E "BUILD (SUCCEEDED|FAILED)" build.log || tail -40 build.log
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: box-build-log
          path: ios/build.log
          retention-days: 5
