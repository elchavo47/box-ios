name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    name: Build, sign and upload Box
    runs-on: macos-26
    timeout-minutes: 60

    env:
      APP_ID: com.aydworks.box

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Install Apple signing material
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$IOS_P12_BASE64" ] || [ -z "$IOS_P12_PASSWORD" ] || [ -z "$IOS_PROFILE_BASE64" ]; then
            echo 'Missing one of IOS_P12_BASE64, IOS_P12_PASSWORD, IOS_PROFILE_BASE64' >&2
            exit 1
          fi

          P12_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/box.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/box-profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/box-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          fail() { echo "::error title=Imzalama::$1"; exit 1; }

          # Secret'a yanlışlıkla giren satır sonu / boşlukları temizle
          IOS_P12_PASSWORD="$(printf '%s' "$IOS_P12_PASSWORD" | tr -d '\r\n')"
          echo "p12 boyutu: $(printf '%s' "$IOS_P12_BASE64" | tr -d ' \r\n' | wc -c) karakter base64, şifre uzunluğu: ${#IOS_P12_PASSWORD}"

          printf '%s' "$IOS_P12_BASE64" | tr -d ' \r\n' | base64 -D > "$P12_PATH" || fail "IOS_P12_BASE64 gecerli base64 degil"
          printf '%s' "$IOS_PROFILE_BASE64" | tr -d ' \r\n' | base64 -D > "$PROFILE_PATH" || fail "IOS_PROFILE_BASE64 gecerli base64 degil"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST" 2>/dev/null || fail "IOS_PROFILE_BASE64 bir provisioning profile degil (box.mobileprovision'in base64'u olmali)"

          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          APP_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"

          case "$APP_IDENTIFIER" in
            *."$APP_ID") ;;
            *)
              fail "Profil yanlis uygulamaya ait: $APP_IDENTIFIER (beklenen $APP_ID)"
              ;;
          esac

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 \
            || fail "p12 ice aktarilamadi: IOS_P12_PASSWORD yanlis ya da IOS_P12_BASE64 bozuk"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Apple Distribution" \
            || fail "p12 icinde Apple Distribution sertifikasi yok"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "IOS_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Refresh provisioning profile (App Store Connect API)
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_P8_BASE64: ${{ secrets.APPSTORE_KEY_P8_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          # Yeni yetenekler (Apple ile giriş, bildirim) eklenince eski profil geçersiz olur.
          # Burada sertifikayla eşleşen yeni bir profil üretilir. Olmazsa secret'taki profille devam edilir.
          set -uo pipefail
          umask 077
          export APPSTORE_KEY_ID="$(printf '%s' "$APPSTORE_KEY_ID" | tr -d ' \r\n\t')"
          export APPSTORE_ISSUER_ID="$(printf '%s' "$APPSTORE_ISSUER_ID" | tr -d ' \r\n\t')"
          export APPSTORE_KEY_PATH="$RUNNER_TEMP/asc-key.p8"
          printf '%s' "$APPSTORE_KEY_P8_BASE64" | tr -d ' \r\n' | base64 -D > "$APPSTORE_KEY_PATH"
          P12_PASS="$(printf '%s' "$IOS_P12_PASSWORD" | tr -d '\r\n')"
          SERIAL="$(openssl pkcs12 -in "$RUNNER_TEMP/distribution.p12" -clcerts -nokeys -passin pass:"$P12_PASS" 2>/dev/null | openssl x509 -noout -serial 2>/dev/null | cut -d= -f2)"
          if [ -z "$SERIAL" ]; then
            SERIAL="$(openssl pkcs12 -legacy -in "$RUNNER_TEMP/distribution.p12" -clcerts -nokeys -passin pass:"$P12_PASS" 2>/dev/null | openssl x509 -noout -serial 2>/dev/null | cut -d= -f2)"
          fi
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet --user pyjwt cryptography
          FRESH="$RUNNER_TEMP/box-fresh.mobileprovision"
          if [ -n "$SERIAL" ] && python3 .github/scripts/refresh_profile.py "$APP_ID" "$SERIAL" "$FRESH"; then
            PLIST="$RUNNER_TEMP/box-fresh.plist"
            security cms -D -i "$FRESH" > "$PLIST"
            UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PLIST")"
            NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PLIST")"
            cp "$FRESH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
            echo "IOS_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
            echo "IOS_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
            echo "Yeni profil kullanılıyor: $NAME"
            /usr/libexec/PlistBuddy -c 'Print :Entitlements' "$PLIST" | grep -E "applesignin|aps-environment" || true
          else
            echo "::warning title=Profil::Yeni profil oluşturulamadı, secret'taki profil kullanılıyor."
          fi
          rm -f "$APPSTORE_KEY_PATH"

      - name: Create signed archive
        working-directory: ios
        run: |
          set -euo pipefail

          xcodebuild archive \
            -project Box.xcodeproj \
            -scheme Box \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Box.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Export App Store IPA
        run: |
          set -euo pipefail

          EXPORT_OPTIONS="$RUNNER_TEMP/BoxExportOptions.plist"

          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>$IOS_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_ID</key>
              <string>$IOS_PROFILE_UUID</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF

          plutil -lint "$EXPORT_OPTIONS"
          mkdir -p build/ipa

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Box.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath build/ipa

          IPA_PATH="$(find build/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Keep IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: box-signed-ipa
          path: build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload to App Store Connect (TestFlight)
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_P8_BASE64: ${{ secrets.APPSTORE_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077

          # Secret'lara yanlışlıkla giren boşluk / satır sonlarını temizle
          APPSTORE_KEY_ID="$(printf '%s' "$APPSTORE_KEY_ID" | tr -d ' \r\n\t')"
          APPSTORE_ISSUER_ID="$(printf '%s' "$APPSTORE_ISSUER_ID" | tr -d ' \r\n\t')"
          echo "Key ID uzunluk: ${#APPSTORE_KEY_ID} (10 olmalı), Issuer ID uzunluk: ${#APPSTORE_ISSUER_ID} (36 olmalı)"

          if [[ -z "$APPSTORE_KEY_ID" || -z "$APPSTORE_ISSUER_ID" || -z "$APPSTORE_KEY_P8_BASE64" ]]; then
            echo "One or more App Store Connect secrets are missing." >&2
            exit 1
          fi

          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          trap 'rm -f "$KEY_PATH"' EXIT

          printf '%s' "$APPSTORE_KEY_P8_BASE64" | tr -d ' \r\n' | base64 -D > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          openssl pkey -in "$KEY_PATH" -noout

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Remove temporary signing material
        if: always()
        run: |
          if [ -n "${IOS_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi
          security delete-keychain "$RUNNER_TEMP/box-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/asc-key.p8" "$RUNNER_TEMP/box-fresh.mobileprovision" "$RUNNER_TEMP/box-fresh.plist"
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/box.mobileprovision" \
                "$RUNNER_TEMP/box-profile.plist" "$RUNNER_TEMP/BoxExportOptions.plist"
