name: Box
options:
  bundleIdPrefix: com.aydworks
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: tr

settings:
  base:
    MARKETING_VERSION: "3.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  Box:
    type: application
    platform: iOS
    sources:
      - path: Box
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aydworks.box
        PRODUCT_NAME: Box
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconLight AppIconGreen"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: NO
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: Box/Box.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        aps-environment: production
    info:
      path: Box/Info.plist
      properties:
        CFBundleDisplayName: Box
        CFBundleDevelopmentRegion: tr
        CFBundleAllowMixedLocalizations: true
        CFBundleLocalizations: [tr, en, de, fr, es, it, pt-BR, nl, ru, uk, pl, az, ar, fa, hi, id, ja, ko, zh-Hans, zh-Hant, sv, el, ro, cs, hu, vi, th]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio]
        CADisableMinimumFrameDurationOnPhone: true
        UIFileSharingEnabled: true
        NSFaceIDUsageDescription: Kilitli klasörü Face ID ile açmak için kullanılır.
        LSSupportsOpeningDocumentsInPlace: true
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: BoxLogo
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Ses dosyası
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
              - public.mpeg-4-audio
              - public.mp3
          - CFBundleTypeName: Box listesi
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.aydworks.box.playlist
          - CFBundleTypeName: Box yedeği
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.aydworks.box.backup
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.aydworks.box.playlist
            UTTypeDescription: Box çalma listesi
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [boxlist]
              public.mime-type: [application/x-boxlist]
          - UTTypeIdentifier: com.aydworks.box.backup
            UTTypeDescription: Box kitaplık yedeği
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [boxbackup]
